<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSON Auto-Battler Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef5;--panel:#fff;--text:#1d2433;--mute:#667089;--line:#ccd4e2;--accent:#3b6fe0;--logbg:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--panel:#1a2030;--text:#e8ecf5;--mute:#8d97b0;--line:#2c344a;--accent:#7aa2ff;--logbg:#131826}}
:root[data-theme="dark"]{--bg:#10141d;--panel:#1a2030;--text:#e8ecf5;--mute:#8d97b0;--line:#2c344a;--accent:#7aa2ff;--logbg:#131826}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:600 15px/1.45 Nunito,system-ui,sans-serif}
button,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font:400 15px/1.4 "Press Start 2P",monospace;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px}
.scene{position:relative;height:340px;border-radius:10px;border:2px solid #20304a;overflow:hidden;
background:linear-gradient(#7ec8f2 0%,#bfe6fb 46%,#8fd06a 46%,#5aa84a 100%)}
.pad{position:absolute;width:190px;height:44px;border-radius:50%;background:radial-gradient(#6b9a3a,#4d7f2c);box-shadow:0 4px 0 #3e6a22}
.pad.o{right:5%;top:34%}.pad.p{left:6%;bottom:6%;width:230px;height:52px}
.sp{position:absolute;display:flex;flex-direction:column;align-items:center;transition:transform .5s,opacity .5s}
.sp.o{right:9%;top:12%}.sp.p{left:10%;bottom:12%}
.av{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;border:4px solid rgba(0,0,0,.35);font-size:48px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.sp.p .av{width:140px;height:140px;font-size:66px}
.sp .nm{margin-top:4px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:1px 8px}
.fainted{transform:translateY(60px) rotate(18deg);opacity:0}
.hit{animation:shake .45s}
.lunge-o{animation:lo .35s}.lunge-p{animation:lp .35s}
@keyframes shake{0%,100%{transform:none;filter:none}20%{transform:translateX(-12px);filter:brightness(2.2)}40%{transform:translateX(10px)}60%{transform:translateX(-7px);filter:brightness(2.2)}80%{transform:translateX(4px)}}
@keyframes lo{50%{transform:translate(-40px,30px)}}@keyframes lp{50%{transform:translate(50px,-34px)}}
.dmg{position:absolute;top:-6px;font:400 14px "Press Start 2P",monospace;color:#fff;text-shadow:2px 2px 0 #c0262d,-1px -1px 0 #c0262d;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
.info{position:absolute;width:250px;background:rgba(255,255,255,.92);color:#1d2433;border:2px solid #20304a;border-radius:8px 8px 8px 0;padding:6px 10px}
.info.o{left:3%;top:6%}.info.p{right:3%;bottom:8%}
.info b{display:flex;justify-content:space-between;font-size:14px}
.info small{font-weight:800;color:#556}
.bar{height:10px;border-radius:5px;background:#2b3345;margin:4px 0 2px;overflow:hidden;border:1px solid #20304a}
.bar i{display:block;height:100%;transition:width .5s,background .5s}
.banner{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;background:rgba(10,14,28,.78);color:#fff;padding:20px}
.banner h2{font:400 18px/1.5 "Press Start 2P",monospace;margin:0;color:#ffd75e}
.banner p{margin:0}
.bov{position:absolute;inset:0;background:#0e1424;color:#fff;display:flex;flex-direction:column;padding:10px 14px}
.bov h2{font:400 12px/1.5 "Press Start 2P",monospace;color:#ffd75e;margin:0 0 6px}
.bov svg{flex:1;min-height:0;width:100%}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:800}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.log{height:170px;overflow-y:auto;background:var(--logbg);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.log p{margin:2px 0}.log .turn{color:var(--mute);font-weight:800;margin-top:8px}
.log .hit-l{color:#c0392b}.log .win{color:#1e8f4e;font-weight:800}
.log p:last-child{background:rgba(120,150,255,.16);border-radius:4px}
h3{font-size:14px;margin:0 0 6px}
.side>*+*{margin-top:12px}
.row{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.row.out{opacity:.45;text-decoration:line-through}
.st{color:var(--mute);font-size:12px}
.m{padding:3px 6px;border-radius:6px;font-size:13px}.m.cur{background:var(--accent);color:#fff}
.m b{font-weight:800}
textarea{width:100%;height:150px;border:2px solid var(--line);border-radius:8px;background:var(--logbg);padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.err{color:#c0392b;font-size:13px;margin:4px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useMemo,useRef,createElement:h}=React;
const CFG={cap:150,hp:[10,100],attack:[1,50],defense:[0,50],rounds:50,v:.15,eff:.5};
const SEED=[
{name:"Glass Cannon",hp:40,attack:50,defense:5,catchphrase:"All offense, no regrets!",victory_quote:"Too fast to hit.",archetype:"Glass Cannon"},
{name:"Unmovable Object",hp:100,defense:40,attack:8,catchphrase:"You shall not merge.",victory_quote:"I outlasted you.",archetype:"Unmovable Object"},
{name:"Balanced Brawler",hp:60,attack:45,defense:45,catchphrase:"Even stats, even temper.",victory_quote:"Consistency wins.",archetype:"Balanced Brawler"},
{name:"NullPointer",hp:70,attack:30,defense:40,catchphrase:"Segfault incoming.",victory_quote:"Undefined behavior.",archetype:"Tank"},
{name:"MergeConflict",hp:45,attack:40,defense:35,catchphrase:"<<<<<<< HEAD",victory_quote:"Resolved. By me.",archetype:"Brawler"},
{name:"janedoe",hp:55,attack:48,defense:40,catchphrase:"My first PR!",victory_quote:"Git good.",archetype:"Rookie"}];
const MOVES=["Git Push --force","Merge Strike","Rebase Slam","Cherry-Pick","Stash Smash","Commit Crime","Blame Beam"];
const ICON=a=>/glass/i.test(a)?"💥":/unmov|tank/i.test(a)?"🛡️":/balanc|brawl/i.test(a)?"🥊":"⚔️";
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function check(o){
 if(!o||typeof o!=="object")return"Fighter must be a JSON object.";
 if(typeof o.name!=="string"||!o.name.trim()||o.name.length>24)return"name must be text, 1 to 24 characters.";
 for(const k of["hp","attack","defense"]){const[lo,hi]=CFG[k];
  if(!Number.isInteger(o[k]))return k+" must be a whole number.";
  if(o[k]<lo||o[k]>hi)return k+" must be between "+lo+" and "+hi+"."}
 const t=o.hp+o.attack+o.defense;
 if(t>CFG.cap)return"Stats total "+t+", which is "+(t-CFG.cap)+" over the cap of "+CFG.cap+".";
 if(typeof o.catchphrase!=="string"||!o.catchphrase||o.catchphrase.length>80)return"catchphrase must be text, up to 80 characters.";
 return null}
function fight(a,b,r){
 const F={a,b},hp={a:a.hp,b:b.hp},ev=[];
 const P=(k,t,x)=>ev.push({k,t,hpA:hp.a,hpB:hp.b,...x});
 P("enter",a.name+': "'+a.catchphrase+'"');P("enter",b.name+': "'+b.catchphrase+'"');
 let end=null;
 for(let n=1;n<=CFG.rounds&&!end;n++){
  P("turn","Turn "+n);
  const first=a.attack>b.attack||(a.attack===b.attack&&r()<.5)?["a","b"]:["b","a"];
  for(const s of first){
   if(hp.a<=0||hp.b<=0)break;
   const d=s==="a"?"b":"a",at=F[s],df=F[d];
   const base=Math.max(1,Math.round(at.attack-df.defense*CFG.eff));
   const dmg=Math.max(1,Math.round(base*(1-CFG.v+2*CFG.v*r())));
   hp[d]=Math.max(0,hp[d]-dmg);
   P("hit",at.name+" used "+MOVES[Math.floor(r()*MOVES.length)]+"! "+df.name+" lost "+dmg+" HP."+(dmg>base*1.1?" A critical hit!":""),{hit:d,dmg,by:s});
  }
  if(hp.a<=0||hp.b<=0)end="ko";
 }
 let w;
 if(end)w=hp.a>0?"a":"b";
 else{P("turn","Time's up! The judges compare remaining HP.");
  const pa=hp.a/a.hp,pb=hp.b/b.hp;w=pa>pb?"a":pb>pa?"b":(r()<.5?"a":"b")}
 const l=w==="a"?"b":"a";
 P("faint",F[l].name+" fainted!",{out:l});
 P("end",F[w].name+': "'+(F[w].victory_quote||F[w].catchphrase)+'"',{win:w});
 return{a,b,winner:F[w],events:ev}}
function tournament(fs,seed){
 const r=rng(seed),arr=fs.slice();
 for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
 let size=1;while(size<arr.length)size*=2;
 let cur=Array(size).fill(null);
 arr.forEach((f,i)=>{cur[i<size/2?2*i:2*(i-size/2)+1]=f});
 const rounds=[],tree=[];let fi=0;
 while(cur.length>1){const ms=[],nx=[],nodes=[];
  for(let i=0;i<cur.length;i+=2){const a=cur[i],b=cur[i+1];
   if(!a||!b){const w=a||b;nodes.push({a,b,w,idx:-1});nx.push(w);continue}
   const m=fight(a,b,r);ms.push(m);nodes.push({a,b,w:m.winner,idx:fi++});nx.push(m.winner)}
  rounds.push(ms);tree.push(nodes);cur=nx}
 return{rounds,tree,champion:cur[0],flat:rounds.flatMap((ms,ri)=>ms.map(m=>({...m,ri})))}}

function Sprite({f,side,fainted,ev,ei}){
 const hit=ev.hit===(side==="o"?ev.oSide:ev.pSide);
 const lunge=ev.k==="hit"&&ev.by===(side==="o"?ev.oSide:ev.pSide);
 const cls="sp "+side+(fainted?" fainted":"");
 const inner="av"+(hit?" hit":"")+(lunge?" lunge-"+side:"");
 return h("div",{className:cls},
  hit&&h("div",{className:"dmg",key:"d"+ei},"-"+ev.dmg),
  h("div",{className:inner,key:"a"+ei,style:{background:"radial-gradient(circle at 35% 30%,hsl("+hue(f.name)+",80%,75%),hsl("+hue(f.name)+",65%,45%))"}},ICON(f.archetype||"")),
  h("div",{className:"nm"},f.name))}
function Info({f,hp,side}){
 const pct=Math.max(0,hp/f.hp*100),col=pct>50?"#4ade80":pct>20?"#facc15":"#ef4444";
 return h("div",{className:"info "+side},
  h("b",null,h("span",null,f.name),h("small",null,f.archetype||"")),
  h("div",{className:"bar"},h("i",{style:{width:pct+"%",background:col}})),
  h("small",null,"HP "+hp+" / "+f.hp+"   ATK "+f.attack+"   DEF "+f.defense))}

function Bracket({T,rev}){
 const tree=T.tree,R=tree.length,P=66,W=170,G=56,H=52;
 const dec=(r,i)=>{const n=tree[r][i];return n.idx<0||n.idx<=rev};
 const vis=(r,i)=>r===0||(dec(r-1,2*i)&&dec(r-1,2*i+1));
 const cy=(r,i)=>P*Math.pow(2,r)*(i+.5),X=r=>r*(W+G)+8;
 const total=P*tree[0].length,width=X(R)+W+8;
 const cut=t=>t.length>20?t.slice(0,19)+"…":t;
 const els=[];
 tree.forEach((nodes,r)=>nodes.forEach((n,i)=>{
  const y=cy(r,i),x=X(r),d=dec(r,i),v=vis(r,i),cur=n.idx===rev;
  if(r<R-1){const x1=x+W,x2=X(r+1),y2=cy(r+1,i>>1),xm=x1+G/2;
   els.push(h("path",{key:"c"+r+"_"+i,d:"M"+x1+" "+y+"H"+xm+"V"+y2+"H"+x2,fill:"none",stroke:cur?"#ffd75e":d&&v?"#4ade80":"#3a4566",strokeWidth:cur?4:2}))}
  els.push(h("rect",{key:"b"+r+"_"+i,x,y:y-H/2,width:W,height:H,rx:6,fill:"#1a2238",stroke:cur?"#ffd75e":"#3a4566",strokeWidth:cur?3:1.5}));
  [n.a,n.b].forEach((f,k)=>{
   const won=d&&v&&f&&f===n.w,lost=d&&v&&f&&f!==n.w,ry=y-H/2+k*(H/2);
   const label=!v?"TBD":f?f.name:"BYE";
   if(won)els.push(h("rect",{key:"w"+r+"_"+i+k,x:x+2,y:ry+2,width:W-4,height:H/2-4,rx:4,fill:"#1e8f4e"}));
   els.push(h("text",{key:"t"+r+"_"+i+k,x:x+10,y:ry+H/4+5,fontSize:14,fontWeight:won?800:600,fill:"#fff",opacity:lost||!v||!f?.45:1,textDecoration:lost?"line-through":"none"},cut(label)));
   if(won)els.push(h("text",{key:"k"+r+"_"+i+k,x:x+W-20,y:ry+H/4+5,fontSize:14,fill:"#fff"},"✓"))})}));
 const fin=dec(R-1,0),fy=cy(R-1,0);
 els.push(h("rect",{key:"champ",x:X(R),y:fy-H/2,width:W,height:H,rx:6,fill:fin?"#7a5b00":"#1a2238",stroke:"#ffd75e",strokeWidth:fin?3:1.5}));
 els.push(h("text",{key:"champt",x:X(R)+10,y:fy+5,fontSize:15,fontWeight:800,fill:"#fff"},fin?"👑 "+cut(tree[R-1][0].w.name):"Champion"));
 return h("svg",{viewBox:"0 0 "+width+" "+total,preserveAspectRatio:"xMidYMid meet",role:"img","aria-label":"Tournament bracket"},els)}

function App(){
 const[fighters,setF]=useState([]);
 const[seed,setSeed]=useState(2024);
 const[mi,setMi]=useState(0),[ei,setEi]=useState(0);
 const[showB,setShowB]=useState(false);
 const[play,setPlay]=useState(false),[speed,setSpeed]=useState(1);
 const[adding,setAdding]=useState(false),[txt,setTxt]=useState(JSON.stringify({name:"Your Name",hp:50,attack:25,defense:25,catchphrase:"Say something memorable!",archetype:"Balanced Brawler"},null,2)),[err,setErr]=useState("");
 
 useEffect(()=>{
  fetch('/api/fighters')
   .then(r=>r.json())
   .then(data=>{
    if(data.length>0)setF(data);
    else setF(SEED);
   })
   .catch(e=>setF(SEED));
 },[]);

 const T=useMemo(()=>tournament(fighters,seed),[fighters,seed]);
 const ms=T.flat,m=ms[mi];
 const logRef=useRef(null);
 const last=m&&mi===ms.length-1&&ei===m.events.length-1;
 useEffect(()=>{
  if(!play||!m)return;
  const ev=m.events[ei],fin=ei===m.events.length-1,lastM=mi===ms.length-1;
  const d=showB?3400/speed:{enter:1300,turn:450,hit:1050,faint:1300,end:1900}[ev.k]/speed;
  const t=setTimeout(()=>{
   if(showB){setShowB(false);setMi(mi+1);setEi(0)}
   else if(fin){setShowB(true);if(lastM)setPlay(false)}
   else setEi(ei+1)},d);
  return()=>clearTimeout(t)},[play,mi,ei,speed,m,ms.length,showB]);
 useEffect(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight},[mi,ei]);
 const reset=s=>{setShowB(false);setMi(0);setEi(0);setPlay(false);if(s!=null)setSeed(s)};
 const skip=()=>{if(mi<ms.length-1){setShowB(false);setMi(mi+1);setEi(0)}};
 const add=()=>{
  let o;try{o=JSON.parse(txt)}catch(e){return setErr("That is not valid JSON: "+e.message)}
  const p=check(o);if(p)return setErr(p);
  if(fighters.some(f=>f.name.toLowerCase()===o.name.toLowerCase()))return setErr("A fighter with that name already exists.");
  setF([...fighters,o]);setErr("");reset()};
 const out=new Set();
 ms.forEach((x,i)=>{if(i<mi||(i===mi&&m&&m.events.slice(0,ei+1).some(e=>e.k==="faint")))out.add(x.winner===x.a?x.b.name:x.a.name)});
 if(last)out.delete(T.champion.name);
 let scene;
 if(!m){scene=h("div",{className:"scene"},h("div",{className:"banner"},h("h2",null,T.champion?"Champion":"Add fighters"),h("p",null,T.champion?T.champion.name+" wins by default.":"Add at least one fighter.")))}
 else{
  const ev={...m.events[ei],oSide:"b",pSide:"a"};
  const fa=m.events.slice(0,ei+1).find(e=>e.k==="faint");
  scene=h("div",{className:"scene"},
   h("div",{className:"pad o"}),h("div",{className:"pad p"}),
   h(Sprite,{f:m.b,side:"o",fainted:fa&&fa.out==="b",ev,ei}),
   h(Sprite,{f:m.a,side:"p",fainted:fa&&fa.out==="a",ev,ei}),
   h(Info,{f:m.b,hp:ev.hpB,side:"o"}),h(Info,{f:m.a,hp:ev.hpA,side:"p"}),
   showB&&h("div",{className:"bov"},h("h2",null,last?"Final: "+T.champion.name+" wins the tournament":"Round "+(m.ri+1)+": "+m.winner.name+" advances"),h(Bracket,{T,rev:mi})))}
 const lines=m?m.events.slice(0,ei+1):[];
 return h("div",{className:"wrap"},
  h("h1",null,"JSON Auto-Battler Arena"),
  h("div",{className:"grid"},
   h("div",null,
    scene,
    h("div",{className:"ctl"},
     h("button",{className:"btn pri",onClick:()=>{if(last||!m){reset()}setPlay(p=>!p)}},play?"Pause":last?"Replay":mi===0&&ei===0?"Start battle":"Resume"),
     h("button",{className:"btn",onClick:skip,disabled:!m||mi>=ms.length-1},"Skip match"),
     [1,2,4].map(s=>h("button",{key:s,className:"btn"+(speed===s?" on":""),onClick:()=>setSpeed(s)},s+"x")),
     h("button",{className:"btn",onClick:()=>reset(Math.floor(Math.random()*1e6))},"Reshuffle bracket"),
     h("button",{className:"btn"+(adding?" on":""),onClick:()=>setAdding(a=>!a)},"Add fighter")),
    h("div",{className:"log",ref:logRef,"aria-live":"polite"},
     lines.length?lines.map((e,i)=>h("p",{key:i,className:e.k==="turn"?"turn":e.k==="hit"?"hit-l":e.k==="end"?"win":""},e.t)):h("p",{className:"st"},"Press Start battle to begin. Seed "+seed+"."))),
   h("div",{className:"side"},
    h("div",{className:"panel"},h("h3",null,"Bracket"),
     T.rounds.map((r,ri)=>h("div",{key:ri,style:{marginBottom:8}},
      h("div",{className:"st"},ri===T.rounds.length-1?"Final":"Round "+(ri+1)),
      r.map((x,i)=>{const idx=ms.indexOf(ms.find(y=>y===x||(y.a===x.a&&y.b===x.b&&y.ri===ri)));
       const done=idx<mi||(idx===mi&&last)||(idx===mi&&m.events.slice(0,ei+1).some(e=>e.k==="end"));
       return h("div",{key:i,className:"m"+(idx===mi?" cur":"")},
        done?h("b",null,x.winner.name):x.a.name+" vs "+x.b.name,done?" beat "+(x.winner===x.a?x.b.name:x.a.name):"")}))) ),
    h("div",{className:"panel"},h("h3",null,"Roster ("+fighters.length+")"),
     fighters.map(f=>h("div",{key:f.name,className:"row"+(out.has(f.name)?" out":"")},
      h("span",null,ICON(f.archetype||"")+" "+f.name),h("span",{className:"st"},f.hp+"/"+f.attack+"/"+f.defense)))),
    adding&&h("div",{className:"panel"},h("h3",null,"New fighter (JSON)"),
     h("textarea",{value:txt,onChange:e=>setTxt(e.target.value),spellCheck:false,"aria-label":"Fighter JSON"}),
     err&&h("div",{className:"err",role:"alert"},err),
     h("div",{className:"ctl"},h("button",{className:"btn pri",onClick:add},"Add to roster")),
     h("div",{className:"st"},"Stats must total "+CFG.cap+" or less.")))))}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
